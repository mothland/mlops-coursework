[project]
name = "churnlab"
version = "0.1.0"
description = "IBM Telco customer churn prediction project (ESILV MLOps course)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy~=1.26.0",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.5,<1.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
